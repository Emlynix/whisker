# Whisker mouse catalogue: brand -> model. Read by src/devices/data.rs
# (format in src/devices.rs). Order here = order in the picker; each
# brand with `auto` ends in "Other <brand> mouse (auto-detect)".
#
# The drivers keep the protocol (commands, scales, codes). DPI ranges and
# rates below repeat what the driver reports; driver tests check both agree.

# White Shark: Telink "M022" firmware.
[[brand]]
id = whiteshark
name = "White Shark"
family = telink-m022
auto = 0x248A

[[mouse]]
brand = whiteshark
model = "Lionel"
vid = 0x248A
pids = 0x5B2F receiver, 0x5B2E cable
support = full

# Logitech HID++ 2.0 mice. Source: Solaar (github.com/pwr-Solaar/Solaar),
# lib/logitech_receiver/descriptors.py at 5e4ae72 (2026-07-04): names,
# cable ids (usbid) and Bluetooth ids (btid); HID++ 1.0-only mice left out.
# Receivers: lib/logitech_receiver/base_usb.py, same date. Mice paired to
# a receiver cannot be told apart by USB id: the receiver picks the auto
# entry and the mouse names itself over HID++.
[[brand]]
id = logitech
name = "Logitech"
family = hidpp
auto = 0x046D
# Checked on hardware: name, firmware, battery (2026-11-09).
verified = "M705"
# Bolt, Unifying, Nano, Lightspeed, EX100.
receivers = 0xC548, 0xC52B, 0xC532, 0xC52F, 0xC518, 0xC51A, 0xC51B, 0xC521, 0xC525, 0xC526, 0xC52E, 0xC531, 0xC534, 0xC535, 0xC537, 0xC539, 0xC53A, 0xC53D, 0xC53F, 0xC541, 0xC545, 0xC547, 0xC54D, 0xC517

[[mouse]]
