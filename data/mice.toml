# Eternico: two receivers, no vendor-wide driver.
[[brand]]
id = eternico
name = "Eternico"
family = eternico

# Listen-only: battery and DPI stage, nothing to set.
[[mouse]]
brand = eternico
model = "AET-MS480B"
vid = 0x1D57
pids = 0xFA60 receiver
support = partial
stage_dpi = 1200, 2400, 3200, 6400

# Reuses an Apple keyboard id; only its mouse collection is matched.
# Link state only: statistics, plus a Bluetooth battery where any.
[[mouse]]
brand = eternico
model = "AET-MVS490B"
vid = 0x05AC
pids = 0x024F receiver
family = none
support = stats-only

