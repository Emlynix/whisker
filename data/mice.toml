# Whisker mouse catalogue: brand -> model. Read by src/devices/data.rs
# (format in src/devices.rs). Order here = order in the picker; each
# brand with `auto` ends in "Other <brand> mouse (auto-detect)".
#
# The drivers keep the protocol (commands, scales, codes). DPI ranges and
# rates below repeat what the driver reports; driver tests check both agree.

# White Shark: Telink "M022" firmware.
[[brand]]
id = whiteshark
name = "White Shark"
family = telink-m022
auto = 0x248A

[[mouse]]
brand = whiteshark
model = "Lionel"
vid = 0x248A
pids = 0x5B2F receiver, 0x5B2E cable
support = full

[[brand]]
id = logitech
name = "Logitech"
family = hidpp
auto = 0x046D
# Checked on hardware: name, firmware, battery (2026-11-09).
verified = "M705"

[[brand]]
id = razer
name = "Razer"
family = razer
auto = 0x1532

