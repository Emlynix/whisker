[package]
name = "whisker"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Emlynix/whisker"

# Windows backend (src/platform/windows) only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM-based APIs only: Direct2D/DirectWrite drawing and Start menu shortcut.
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-numerics = "0.3"

# Linux backend (src/platform/linux) only: GTK 3 window, Cairo shapes,
# Pango text, GIO D-Bus; libc for hidraw/evdev ioctls and poll.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
pangocairo = "0.18"
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
