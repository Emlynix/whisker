# Builds Whisker for Windows and Linux. A tag "v<version>" also signs the
# files and publishes a GitHub release with latest.json for the updater.
#
#   tag v0.9.1 ──> test + build (windows, linux) ──> sign ──> release
#                                                     │
#   release assets: whisker-windows-x86_64.exe(.sig), whisker-linux-x86_64(.sig),
#                   latest.json  (pulled by whisker.emlynix.com / dl.emlynix.com)
#
# Manual run (Actions → Release → Run workflow): build and test only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Where dl.emlynix.com mirrors the release files.
  DL_BASE: https://dl.emlynix.com/whisker

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            built: target/release/whisker.exe
            asset: whisker-windows-x86_64.exe
          # Oldest supported runner: the binary runs on glibc 2.35 and newer.
          - os: ubuntu-22.04
            built: target/release/whisker
            asset: whisker-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: GTK 3 headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Rust
        run: rustup update stable && rustup default stable

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$crate" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $crate"; exit 1; }

      - name: Test
        run: cargo test --locked

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked
          mkdir dist && cp "${{ matrix.built }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Signs "whisker|<platform>|<version>|<sha256>" (see src/update/sig.rs)
      # and checks each signature against the public key before publishing.
      - name: Sign and write latest.json
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "secret RELEASE_SIGNING_KEY missing"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/key.pem"; pub="$RUNNER_TEMP/pub.pem"
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          openssl ec -in "$key" -pubout -out "$pub" 2>/dev/null

          assets='{}'
          for pair in windows-x86_64:whisker-windows-x86_64.exe linux-x86_64:whisker-linux-x86_64; do
            platform="${pair%%:*}"; file="dist/${pair#*:}"
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            statement="whisker|$platform|$version|$sha"
            printf '%s' "$statement" | openssl dgst -sha256 -sign "$key" -out "$file.sig"
            printf '%s' "$statement" | openssl dgst -sha256 -verify "$pub" -signature "$file.sig"
            assets=$(jq -c --arg p "$platform" --arg u "$DL_BASE/$version/${pair#*:}" \
              --arg s "$sha" --arg g "$(base64 -w0 "$file.sig")" \
              '. + {($p): {url: $u, sha256: $s, sig: $g}}' <<< "$assets")
          done
          rm -f "$key"

          notes="docs/releases/v$version.txt"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          jq -n --arg v "$version" --arg d "$(date -u +%F)" --rawfile n "$notes" \
            --argjson a "$assets" '{version: $v, date: $d, notes: $n, assets: $a}' > dist/latest.json
          cat dist/latest.json

      # Not a draft or prerelease: /releases/latest must return it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Whisker $version" --notes-file "docs/releases/v$version.md" --latest
